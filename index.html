<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>聊天记录报告生成器</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5b8def">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="side-head">📊 聊天记录报告生成器<span class="offline-tag" id="offlineTag" hidden>离线可用</span><span class="ver-tag" id="verTag">v0.2.1</span></div>

    <div class="group">
      <div class="group-title">① 导入聊天记录</div>
      <textarea id="importText" placeholder="粘贴导出内容：QQ 消息管理器 txt / OneBot·NapCat JSON / 微信 CSV / 微信 txt / 微信合并转发 txt"></textarea>
      <input type="text" id="myName" class="nick-input" placeholder="我的昵称（可选）">
      <div class="btn-row">
        <button id="btnDetect">识别并导入粘贴内容</button>
      </div>
      <div class="btn-row">
        <button id="btnPickFile">选择文件（可多选）</button>
        <button id="btnPickFolder">选择导出文件夹</button>
      </div>
      <div class="btn-row">
        <button id="btnPickImages">选择聊天截图（OCR）</button>
        <input type="date" id="ocrDate" title="截图对应的日期（可选，截图没有日期分隔线时填写）">
        <label class="chk"><input type="checkbox" id="ocrSenders"> 识别群聊发言人名</label>
        <button id="btnLoadDemo">载入演示数据集</button>
      </div>
      <input type="file" id="importFile" accept=".txt,.json,.csv" multiple hidden>
      <input type="file" id="folderInput" webkitdirectory hidden>
      <input type="file" id="imgInput" accept="image/png,image/jpeg,image/webp" multiple hidden>
      <div class="hint" id="detectInfo"></div>
      <div class="hint">截图 OCR 建议选择带日期分隔线的截图；没有日期时可先填上面的日期再识别。</div>
    </div>

    <div class="group">
      <div class="group-title">② 已导入记录（勾选参与合并）</div>
      <div class="range-row">
        <span>统计范围</span>
        <input type="date" id="rangeFrom"> <span>~</span>
        <input type="date" id="rangeTo">
        <button id="btnRangeClear" class="mini">全部</button>
      </div>
      <div class="record-list" id="recordList"></div>
      <div class="hint" id="recordsInfo">还没有导入记录。</div>
    </div>

    <div class="group">
      <div class="group-title">③ 报告模板</div>
      <div class="tpl-grid">
        <label><input type="radio" name="tpl" value="love" checked><span>💕 恋爱</span></label>
        <label><input type="radio" name="tpl" value="family"><span>🏠 亲情</span></label>
        <label><input type="radio" name="tpl" value="friendship"><span>🤝 友情</span></label>
        <label><input type="radio" name="tpl" value="general"><span>📊 通用</span></label>
        <label><input type="radio" name="tpl" value="work"><span>💼 职场</span></label>
        <label><input type="radio" name="tpl" value="bestie"><span>👯 闺蜜</span></label>
        <label><input type="radio" name="tpl" value="roommate"><span>🛋️ 室友</span></label>
        <label><input type="radio" name="tpl" value="parent"><span>👶 亲子</span></label>
        <label><input type="radio" name="tpl" value="group"><span>👥 群聊</span></label>
      </div>
    </div>

    <div class="btn-col">
      <button id="btnGenerate" class="primary">合并勾选并生成报告</button>
      <button id="btnClearRecords">清空记录列表</button>
    </div>

    <div class="side-foot">数据仅在本地处理，不上传任何内容</div>
  </aside>

  <main class="viewer">
    <div class="toolbar">
      <div class="tabs">
        <button id="tabHtml" class="active">HTML 报告</button>
        <button id="tabMd">Markdown 预览</button>
      </div>
      <div class="tool-actions">
        <input type="text" id="titleInput" placeholder="报告标题（可选）">
        <button id="btnDownloadHtml">下载 HTML</button>
        <button id="btnDownloadMd">下载 Markdown</button>
        <button id="btnCopyHtml">复制 HTML</button>
        <button id="btnPrint">打印 / 导出 PDF</button>
      </div>
    </div>
    <div class="empty" id="emptyHint">载入数据后点击「合并勾选并生成报告」<br>也可直接「载入演示数据集」体验</div>
    <iframe id="frame" sandbox="" title="报告预览"></iframe>
    <pre id="mdView"></pre>
  </main>
</div>
<script src="vendor/ocr/tesseract.min.js"></script>
<script src="vendor/report.umd.js"></script>
<script src="vendor/import.umd.js"></script>
<script src="shared/records-logic.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
